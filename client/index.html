<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>This &amp; That</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header>
      <h1>This <span>&amp;</span> That</h1>
      <p class="tag">Point at it, say it, done.</p>
      <nav>
        <label class="btn">Open<input id="file" type="file" accept="image/*" hidden /></label>
        <button id="sample" class="btn">Sample</button>
        <button id="clear" class="btn">Clear marks</button>
        <button id="undo" class="btn">Undo</button>
      </nav>
    </header>

    <main id="stage">
      <canvas id="canvas"></canvas>
      <p id="empty">Open or paste an image, or try the sample.</p>
      <div id="compare" hidden>
        <img id="after" alt="after" />
        <div id="beforeClip"><img id="before" alt="before" /></div>
        <div id="handle"></div>
        <span class="corner left">Before</span><span class="corner right">After</span>
      </div>
    </main>

    <footer>
      <button id="talk" aria-label="Talk">
        <span class="dot"></span><span id="talkLabel">Hold or tap, then draw and talk</span>
      </button>
      <div id="panel">
        <ol id="stages" hidden>
          <li data-stage="sam">SAM: outlining what you marked</li>
          <li data-stage="understand">Spark: watching and listening</li>
          <li data-stage="edit">Muse Image: editing the marked parts</li>
          <li data-stage="paste">Pasting back only those parts</li>
        </ol>
        <p id="caption"></p>
        <ul id="edits"></ul>
        <div id="review" hidden>
          <button id="keep" class="btn primary">Keep</button>
          <button id="discard" class="btn">Discard</button>
        </div>
      </div>
    </footer>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
